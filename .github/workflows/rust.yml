name: Rust
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache OpenCV
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: /usr/local
        key: ${{ runner.os }}-opencv-4.11.0
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git pkg-config libgtk-3-dev \
          libavcodec-dev libavformat-dev libswscale-dev libv4l-dev \
          libxvidcore-dev libx264-dev libjpeg-dev libpng-dev libtiff-dev \
          gfortran openexr libatlas-base-dev python3-dev python3-numpy \
          libtbb2 libtbb-dev libdc1394-dev libopenexr-dev \
          libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libclang-dev
        
    - name: Build OpenCV 4.11.0
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 4.11.0 https://github.com/opencv/opencv.git
        cd opencv
        mkdir build && cd build
        cmake -D CMAKE_BUILD_TYPE=RELEASE \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D INSTALL_C_EXAMPLES=OFF \
              -D INSTALL_PYTHON_EXAMPLES=OFF \
              -D OPENCV_GENERATE_PKGCONFIG=ON \
              -D BUILD_EXAMPLES=OFF \
              -D BUILD_TESTS=OFF \
              -D BUILD_PERF_TESTS=OFF \
              ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        
    - name: Check OpenCV version
      run: |
        pkg-config --modversion opencv4
        ldconfig -p | grep opencv
        
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.86.0
        components: clippy
        
    - name: Cache Cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
          ${{ runner.os }}-cargo-
          
    - name: Clippy
      run: cargo clippy -- -W clippy::pedantic
      
    - name: Check for outdated dependencies
      run: |
        cargo install cargo-outdated --locked || true
        cargo outdated -d2
        
    - name: Check for unused dependencies
      run: |
        rustup toolchain install nightly
        cargo install cargo-udeps --locked || true
        cargo +nightly udeps
        
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Generate code coverage
      run: |
        cargo install cargo-tarpaulin --version 0.27.2 --locked
        cargo tarpaulin --all-features --workspace --out Xml --avoid-cfg-tarpaulin
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: cobertura.xml
