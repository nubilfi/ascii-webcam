name: Rust

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Cache apt packages
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key:
          ${{ runner.os }}-apt-${{ hashFiles('.github/apt-packages.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Create apt packages list if cache miss
      if: steps.apt-cache.outputs.cache-hit != 'true'
      run: |
        echo "libclang-dev libopencv-dev python3-opencv" > .github/apt-packages.txt
        sudo apt-get update
        sudo apt-get install -y $(cat .github/apt-packages.txt)

    - name: Set up Rust
      uses: hecrj/setup-rust-action@v2
      with:
        rust-version: 1.83.0

    - uses: actions/cache@v4
      id: cargo-cache
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key:
          ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
      name: Update dependencies
      continue-on-error: true
      run: cargo update

    - name: Install deps
      run: rustup update

    - name: Outdated
      run: |
        cargo install cargo-outdated && \
        cargo outdated -d2

    - name: Unused Deps
      run: |
        rustup update nightly && \
        cargo +nightly install cargo-udeps && \
        cargo +nightly udeps

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test

    - name: Generate code coverage
      run: |
        cargo install cargo-tarpaulin --version 0.27.2 && \
        cargo tarpaulin --all-features --workspace --out Xml --avoid-cfg-tarpaulin
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: cobertura.xml
