name: Rust
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libopencv-dev python3-opencv
        
    - name: Check OpenCV version
      run: |
        pkg-config --modversion opencv4 || echo "OpenCV4 not found"
        dpkg -l | grep libopencv
        
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.86.0
        components: clippy
        
    - name: Cache Cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
          ${{ runner.os }}-cargo-
          
    - name: Clippy
      run: cargo clippy -- -W clippy::pedantic
      
    - name: Check for outdated dependencies
      run: |
        cargo install cargo-outdated --locked || true
        cargo outdated -d2
        
    - name: Check for unused dependencies
      run: |
        rustup toolchain install nightly
        cargo install cargo-udeps --locked || true
        cargo +nightly udeps
        
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Generate code coverage
      run: |
        cargo install cargo-tarpaulin --version 0.27.2 --locked
        cargo tarpaulin --all-features --workspace --out Xml --avoid-cfg-tarpaulin
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: cobertura.xml
